# Add-on: CUPS sidecar for setups without a CUPS server
#   docker compose -f docker-compose.yml -f docker-compose.cups.yml up -d
# Web admin: http://localhost:631 (print / print)

services:
  app:
    environment:
      - CUPS_URL=http://cups:631
    depends_on:
      - cups

  cups:
    image: olbat/cupsd:latest
    container_name: postpal-cups
    ports:
      - "631:631"
    volumes:
      - /var/run/dbus:/var/run/dbus
      - /dev/bus/usb:/dev/bus/usb
      - cups-data:/etc/cups
      - ./cups/cupsd.conf:/etc/cups/cupsd.conf:ro
    environment:
      - CUPS_ADMIN_USER=${CUPS_ADMIN_USER:-print}
      - CUPS_ADMIN_PASSWORD=${CUPS_ADMIN_PASSWORD:-print}
    privileged: true
    restart: unless-stopped

volumes:
  cups-data:
