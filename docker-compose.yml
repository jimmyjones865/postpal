services:
  app:
    build: .
    container_name: postpal
    stop_grace_period: 160s
    ports:
      - "3001:3000"
    volumes:
      - labels-data:/data/labels
      # products.json holds the available Deutsche Post shipping product list, incl. their prices. Adjust as needed, then reload the container
      - ./public/products.json:/app/public/products.json:ro
      # Cardmarket shipping cost → product code; edit, then recreate the container
      - ./server/cm-shipping.json:/app/cm-shipping.json:ro
    # All settings from .env (see .env.example); container paths fixed here
    env_file: .env
    environment:
      - PORT=3000
      - PDF_STORAGE_PATH=/data/labels
      - STATIC_PATH=/app/public
    # SALES_URL=http://host.docker.internal:3003 reaches turbostats on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  labels-data:
