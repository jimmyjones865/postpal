services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - labels-data:/data/labels
      - ./public/products.json:/app/public/products.json:ro
    env_file:
      - .env
    environment:
      - PORT=3000
      - PDF_STORAGE_PATH=/data/labels
      - RETENTION_DAYS=60
      - STATIC_PATH=/app/public
    restart: unless-stopped

volumes:
  labels-data:
